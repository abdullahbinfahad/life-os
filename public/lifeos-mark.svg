<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="lifeos-title lifeos-desc">
  <title id="lifeos-title">Life OS</title>
  <desc id="lifeos-desc">A luminous compass star connected to four orbiting points, representing a connected personal operating system.</desc>
  <defs>
    <linearGradient id="tile" x1="20" y1="20" x2="236" y2="236" gradientUnits="userSpaceOnUse">
      <stop stop-color="#312e81"/>
      <stop offset=".5" stop-color="#172554"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <linearGradient id="orbit" x1="48" y1="44" x2="211" y2="213" gradientUnits="userSpaceOnUse">
      <stop stop-color="#a5b4fc"/>
      <stop offset=".52" stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="star" x1="87" y1="87" x2="170" y2="170" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff"/>
      <stop offset=".48" stop-color="#c7d2fe"/>
      <stop offset="1" stop-color="#67e8f9"/>
    </linearGradient>
    <filter id="soft-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="256" height="256" fill="url(#tile)"/>
  <rect x="4" y="4" width="248" height="248" rx="72" fill="none" stroke="#c7d2fe" stroke-opacity=".13" stroke-width="3"/>
  <circle cx="128" cy="128" r="78" fill="none" stroke="url(#orbit)" stroke-linecap="round" stroke-width="10" stroke-dasharray="405 86" transform="rotate(-47 128 128)" opacity=".94"/>
  <g fill="#a5f3fc" filter="url(#soft-glow)">
    <circle cx="128" cy="45" r="8"/>
    <circle cx="211" cy="128" r="8"/>
    <circle cx="128" cy="211" r="8"/>
    <circle cx="45" cy="128" r="8"/>
  </g>
  <path d="m128 79 15.5 33.5L177 128l-33.5 15.5L128 177l-15.5-33.5L79 128l33.5-15.5L128 79Z" fill="url(#star)" filter="url(#soft-glow)"/>
  <circle cx="128" cy="128" r="8" fill="#fff"/>
</svg>
