    <style>
      #public-seo-fallback{min-height:100svh;display:grid;place-items:center;padding:2rem 1rem;background:radial-gradient(ellipse at 80% 5%,rgba(99,91,255,.15),transparent 42%),linear-gradient(145deg,#f8f9ff,#fff 55%,#f4f5ff);color:#171923;font:16px/1.6 Inter,system-ui,sans-serif}
      #public-seo-fallback section,#public-seo-fallback article{width:min(100%,720px);padding:clamp(1.5rem,5vw,3rem);border:1px solid rgba(99,91,255,.15);border-radius:24px;background:rgba(255,255,255,.88);box-shadow:0 20px 60px rgba(44,48,95,.08)}

      @media(prefers-color-scheme:dark){#public-seo-fallback{background:radial-gradient(ellipse at 80% 5%,rgba(99,91,255,.2),transparent 42%),#0b0d12;color:#f4f5f8}#public-seo-fallback section,#public-seo-fallback article{border-color:rgba(255,255,255,.12);background:rgba(18,20,28,.92)}#public-seo-fallback p{color:#b3b7c5}}

  <body>
    <div id="root"><div id="boot" role="status" aria-label="Loading Life OS"><svg class="boot-mark" viewBox="0 0 64 64" width="72" height="72" aria-hidden="true"><defs><linearGradient id="bt" x1="4" y1="4" x2="60" y2="60" gradientUnits="userSpaceOnUse"><stop stop-color="#6366f1"/><stop offset=".55" stop-color="#8b5cf6"/><stop offset="1" stop-color="#ec4899"/></linearGradient></defs><rect x="2" y="2" width="60" height="60" rx="18" fill="url(#bt)"/><circle cx="32" cy="32" r="14" fill="none" stroke="#fff" stroke-opacity=".22" stroke-width="5"/><g class="boot-arc"><circle cx="32" cy="32" r="14" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-dasharray="66 88" transform="rotate(-90 32 32)"/><circle cx="18" cy="32" r="4.2" fill="#a5f3fc"/></g><circle cx="32" cy="32" r="3.4" fill="#fff"/></svg><div class="boot-name">Life OS</div><div class="boot-bar"><i></i></div></div></div>
    <style>
      /* Instant startup screen: drawn by the browser before any JavaScript loads; React replaces it. */
      #boot { position: fixed; inset: 0; display: grid; place-content: center; justify-items: center; gap: 1rem; background: #0b0f17; color: #e2e8f0; font-family: Inter, system-ui, sans-serif; }
      html.boot-light #boot { background: #f6f7fb; color: #1e293b; }
      html.boot-forest #boot { background: #09130f; color: #ecf5ef; }
      #boot::before { content: ''; position: absolute; width: 40rem; height: 40rem; border-radius: 50%; background: radial-gradient(circle, rgba(99,102,241,.22), transparent 65%); animation: boot-breathe 3s ease-in-out infinite; }
      html.boot-forest #boot::before { background: radial-gradient(circle, rgba(16,185,129,.2), transparent 65%); }
      .boot-mark { position: relative; filter: drop-shadow(0 12px 30px rgba(139,92,246,.5)); animation: boot-pop .6s cubic-bezier(.34,1.56,.64,1) both; }
      .boot-arc { transform-origin: 32px 32px; animation: boot-spin 1.6s cubic-bezier(.6,.1,.3,.9) infinite; }
      @keyframes boot-pop { from { transform: scale(.6); opacity: 0; } }
      .boot-name { position: relative; font-weight: 700; letter-spacing: -.01em; font-size: 1.05rem; }
      .boot-bar { position: relative; width: 140px; height: 3px; border-radius: 99px; overflow: hidden; background: rgba(148,163,184,.2); }
      .boot-bar i { position: absolute; inset: 0; width: 40%; border-radius: inherit; background: linear-gradient(90deg, #818cf8, #c084fc); animation: boot-slide 1.1s ease-in-out infinite; }
      @keyframes boot-spin { to { transform: rotate(1turn); } }
      @keyframes boot-slide { from { transform: translateX(-110%); } to { transform: translateX(260%); } }
      @keyframes boot-breathe { 50% { transform: scale(1.15); opacity: .7; } }
      @media (prefers-reduced-motion: reduce) { #boot *, #boot::before { animation: none !important; } }
    </style>
    <script>
      try { var t = (JSON.parse(localStorage.getItem('life-os-v1') || '{}').state || {}).settings; t = t && t.theme;
        if (t === 'light' || t === 'paper') document.documentElement.classList.add('boot-light');
        if (t === 'forest') document.documentElement.classList.add('boot-forest'); } catch (e) {}
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
