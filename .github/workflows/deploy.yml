name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
        env:
          # Set these in GitHub → Settings → Secrets and variables → Actions → Variables.
          # Without them the app still works, in "this device only" mode.
          # These are public-by-design Supabase browser values. The fallback keeps
          # deployment working even if repository Actions variables are unavailable.
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || 'https://qzbcanzmgetdrnlijujh.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY || 'sb_publishable_i2kZoTcgXZK-rlWpYX5G8w_FlVI0VfP' }}
      - run: node scripts/prepare-public-pages.mjs
        env:
          # These are the same public-by-design values used by the frontend build.
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || 'https://qzbcanzmgetdrnlijujh.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY || 'sb_publishable_i2kZoTcgXZK-rlWpYX5G8w_FlVI0VfP' }}
      - run: cp dist/index.html dist/404.html
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
